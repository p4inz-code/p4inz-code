<text x="600" y="146" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1b1630">Atharva Patil, independent developer</text>
<text x="600" y="184" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="16" fill="#5b5579">find a gap. understand it deeply. build the solution properly.<tspan class="cur" fill="#9d7fff">_</tspan></text>
