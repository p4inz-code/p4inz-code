<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="P4inz. Atharva Patil, independent developer. Find a gap, understand it deeply, build the solution properly.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcfbff"/><stop offset="1" stop-color="#eee9fd"/></linearGradient><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#3b2d86" fill-opacity="0.09"/></pattern><linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9d7fff"/><stop offset="1" stop-color="#3fc5b8"/></linearGradient></defs>
<style>
.flow{stroke-dasharray:5 9;animation:flow 2.8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.bob{animation:bob 7s ease-in-out infinite}.bob2{animation:bob 8.5s ease-in-out infinite reverse}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ring{transform-origin:600px 300px;animation:ring 5s ease-out infinite}
@keyframes ring{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.9);opacity:0}}
.cur{animation:cur 1.1s steps(2) infinite}@keyframes cur{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flow,.bob,.bob2,.ring,.cur{animation:none}}
</style>
<rect width="1200" height="230" rx="22" fill="url(#bg)"/><rect width="1200" height="230" rx="22" fill="url(#dots)"/>
<g class="bob"><rect x="60" y="40" width="120" height="76" rx="11" fill="#9d7fff" fill-opacity="0.18" stroke="#9d7fff" stroke-opacity="0.7"/><rect x="72" y="54" width="66" height="6" rx="3" fill="#9d7fff" fill-opacity="0.7"/><rect x="72" y="70" width="84" height="6" rx="3" fill="#9d7fff" fill-opacity="0.4"/></g>
<g class="bob"><rect x="110" y="130" width="96" height="62" rx="11" fill="#3fc5b8" fill-opacity="0.18" stroke="#3fc5b8" stroke-opacity="0.7"/><rect x="122" y="144" width="53" height="6" rx="3" fill="#3fc5b8" fill-opacity="0.7"/><rect x="122" y="160" width="67" height="6" rx="3" fill="#3fc5b8" fill-opacity="0.4"/></g>
<g class="bob"><rect x="1020" y="36" width="124" height="80" rx="11" fill="#ff6b6b" fill-opacity="0.18" stroke="#ff6b6b" stroke-opacity="0.7"/><rect x="1032" y="50" width="68" height="6" rx="3" fill="#ff6b6b" fill-opacity="0.7"/><rect x="1032" y="66" width="87" height="6" rx="3" fill="#ff6b6b" fill-opacity="0.4"/></g>
<g class="bob"><rect x="990" y="134" width="100" height="60" rx="11" fill="#f2b134" fill-opacity="0.18" stroke="#f2b134" stroke-opacity="0.7"/><rect x="1002" y="148" width="55" height="6" rx="3" fill="#f2b134" fill-opacity="0.7"/><rect x="1002" y="164" width="70" height="6" rx="3" fill="#f2b134" fill-opacity="0.4"/></g>
<path class="flow" d="M180,78 C260,78 260,150 206,160" fill="none" stroke="#9d7fff" stroke-width="2" stroke-linecap="round"/>
