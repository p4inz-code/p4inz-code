<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="A map of P4inz projects. Creative tools: Kanvaz, Draft, 3D Ref Skills, Reference Engineering. Developer tools and apps: MINK, repo-map, Obscura, DocFlow, Crossport. Security and systems: VERIS, Nexus, PURSUE OS, Mission OS. Games: Project Ascent.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0f17"/><stop offset="1" stop-color="#191730"/></linearGradient><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.06"/></pattern><linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9d7fff"/><stop offset="1" stop-color="#3fc5b8"/></linearGradient></defs>
<style>
.flow{stroke-dasharray:5 9;animation:flow 2.8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.bob{animation:bob 7s ease-in-out infinite}.bob2{animation:bob 8.5s ease-in-out infinite reverse}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ring{transform-origin:600px 300px;animation:ring 5s ease-out infinite}
@keyframes ring{0%{transform:scale(.8);opacity:.5}100%{transform:scale(1.9);opacity:0}}
.cur{animation:cur 1.1s steps(2) infinite}@keyframes cur{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flow,.bob,.bob2,.ring,.cur{animation:none}}
</style>
